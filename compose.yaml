services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - team_data:/var/www/html/data
    expose: ["80"]
  web:
    image: caddy:2
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
volumes:
  team_data:
  caddy_data:
  caddy_config:
